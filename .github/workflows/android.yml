name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mobile-release:
    name: Build Mobile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Signing Keystore & local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
          echo "Using repository secrets for release signing..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        else
          echo "No signing secrets configured. Generating a valid release keystore so APK installs directly..."
          keytool -genkeypair -v \
            -keystore bitchord-release.jks \
            -alias bitchord \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bitchord \
            -keypass bitchord \
            -dname "CN=BitChord, OU=BitChord, O=BitChord, L=Unknown, ST=Unknown, C=US"
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchord"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchord"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Mobile Prod Release APK
      run: ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false --no-daemon --stacktrace

    - name: Verify Generated APKs
      run: ls -lh app/build/outputs/apk/prod/release/

    - name: Upload Mobile Universal APK (Directly Installable)
      uses: actions/upload-artifact@v4
      with:
        name: BitChord-Mobile-Universal-Release
        path: app/build/outputs/apk/prod/release/*universal*.apk
        retention-days: 14

    - name: Upload All Architecture APKs (arm64, armeabi-v7a, x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: BitChord-Mobile-All-ABIs
        path: app/build/outputs/apk/prod/release/*.apk
        retention-days: 14
