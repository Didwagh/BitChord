name = "bitchord-nexus"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Provider roots and secrets are intentionally left empty here.
# Set them in Cloudflare Dashboard -> Workers & Pages -> bitchord-nexus
# -> Settings -> Variables, or with `wrangler secret put NAME`.
# Never commit a filled value; several of these URLs carry personal tokens.
[vars]
AURIX_ROOT = ""
LASTWAVE_ROOT = ""
QOBUZ_PRIMARY_BASE_URL = ""
QOBUZ_UPSTREAM_BASE_URL = ""
MONOCHROME_BASE_URL = ""
HIFI_ADDON_BASE_URL = ""

# Set with `wrangler secret put LW_SECRET`; not stored in this file.
